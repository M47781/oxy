<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Oxycare – Your Smart Oxygen Companion</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --blue:#19847A;
      --orange:#65D4CA;
      --btn-radius:14px;
    }
    body{
      font-family:'Poppins',sans-serif;
      margin:0;
      background:#eeeeee;
      color:#111;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
    }
    .card{
      width:90%;
      max-width:380px;
      padding:28px;
      box-sizing:border-box;
      text-align:center;
      background:#fff;
      border-radius:20px;
      box-shadow:0 8px 25px rgba(0,0,0,0.05);
    }
    .logo{
      width:130px;
      margin:0 auto 12px;
      display:block;
      border-radius:20px;
    }
    h1{
      font-size:18px;
      color:var(--blue);
      margin:0 0 18px;
    }
    .btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      text-decoration:none;
      padding:12px 16px;
      margin:10px 0;
      border-radius:var(--btn-radius);
      font-weight:600;
      color:#ffffff;
      background: linear-gradient(90deg, #19847A, #65D4CA);
      box-shadow:0 6px 18px rgba(3,15,30,0.06);
      transition: all 0.2s ease-in-out;
    }
    .btn img{
      width:28px;
      height:28px;
    }
    .btn:hover{
      transform: translateY(-2px);
      box-shadow:0 10px 25px rgba(3,15,30,0.1);
    }
    footer{
      margin-top:22px;
      font-size:13px;
      color:#777;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="oxycare.png" alt="Oxycare Logo" class="logo">
    <h1>Oxycare – Révolutionnez votre parcours en procréation médicalement assistée et protégez votre santé reproductive et votre fertilité</h1>

    <a class="btn" href="https://www.instagram.com/oxycare.inno/" target="_blank">
      <img src="icons/instagram.png" alt="Instagram Icon"/>Instagram
    </a>
    <a class="btn" href="mailto:oxycare.bio@gmail.com" target="_blank">
      <img src="icons/email.png" alt="Email Icon"/>Email
    </a>

    <footer>Powered by Oxycare | 2025</footer>
  </div>
</body>
</html>
